openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Anonymous account operations
  - name: auction
    description: Demonstration auction operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /account/current:
    get:
      operationId: getCurrentAccount
      tags: [account]
      summary: Get the current anonymous account
      responses:
        "200":
          description: Current account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
  /account/bids:
    get:
      operationId: getAccountBidHistory
      tags: [account]
      summary: Get the current account's bid history
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Current account bid history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBidHistoryPage"
        "400":
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /account/profile:
    post:
      operationId: updateAccountProfile
      tags: [account]
      summary: Set the email shown on the current anonymous account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfileInput"
      responses:
        "200":
          description: Updated account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /account/sign-out:
    post:
      operationId: signOutAccount
      tags: [account]
      summary: Sign out of the current account view
      responses:
        "200":
          description: Updated account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
  /account/top-ups:
    post:
      operationId: createAccountTopUp
      tags: [account]
      summary: Add a supported credit package to the current account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountTopUpInput"
      responses:
        "200":
          description: Updated account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "400":
          description: Unsupported top-up amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Account is signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /account/wins/{winId}/withdrawal:
    post:
      operationId: requestAccountWithdrawal
      tags: [account]
      summary: Request a withdrawal for an account win
      parameters:
        - name: winId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountWithdrawalInput"
      responses:
        "200":
          description: Updated account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "400":
          description: Invalid Pix key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Account is signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Win not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Withdrawal was already requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /account/wins/{winId}/pix-key:
    patch:
      operationId: updateAccountWinPixKey
      tags: [account]
      summary: Update the Pix key for an unpaid account win
      parameters:
        - name: winId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPixKeyInput"
      responses:
        "200":
          description: Updated account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "400":
          description: Invalid Pix key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Account is signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Win not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Pix key cannot be changed before a request or after payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /account/wins/{winId}/advance-withdrawal:
    post:
      operationId: advanceAccountWithdrawal
      tags: [account]
      summary: Advance the withdrawal status for an account win
      parameters:
        - name: winId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "404":
          description: Win not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Withdrawal cannot advance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auctions/demo/current:
    get:
      operationId: getDemoAuction
      tags: [auction]
      summary: Get the current demonstration auction
      responses:
        "200":
          description: Current demonstration auction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoAuction"
  /auctions/demo/bids:
    post:
      operationId: placeDemoAuctionBid
      tags: [auction]
      summary: Place a bid in the demonstration auction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoAuctionBidInput"
      responses:
        "201":
          description: The bid was accepted and the timer was reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoAuction"
        "400":
          description: Invalid bid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoAuctionError"
        "402":
          description: Account has insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoAuctionError"
        "403":
          description: Account is signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoAuctionError"
        "409":
          description: Auction closed or bid below the minimum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoAuctionError"
  /auctions/demo/reset:
    post:
      operationId: resetDemoAuction
      tags: [auction]
      summary: Reset the shared demonstration auction
      responses:
        "200":
          description: Reset demonstration auction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoAuction"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AccountProfileInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required: [email]
    AccountTopUpInput:
      type: object
      properties:
        amountCents:
          type: integer
          enum: [5000, 10000, 20000, 50000]
      required: [amountCents]
    PixKeyType:
      type: string
      enum: [CPF, Celular, E-mail, Aleatória]
    AccountWithdrawalInput:
      type: object
      properties:
        pixType:
          $ref: "#/components/schemas/PixKeyType"
        pixKey:
          type: string
          minLength: 1
          maxLength: 254
    AccountPixKeyInput:
      type: object
      properties:
        pixType:
          $ref: "#/components/schemas/PixKeyType"
        pixKey:
          type: string
          minLength: 1
          maxLength: 254
      required: [pixType, pixKey]
    AccountTransaction:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        amountCents:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, label, amountCents, createdAt]
    AccountWin:
      type: object
      properties:
        id:
          type: integer
        winningBidId:
          type: integer
        winningBidAmountCents:
          type: integer
        prizeCents:
          type: integer
        bonusCents:
          type: integer
        withdrawalStatus:
          type: string
          enum: [available, requested, under_review, paid]
        pixType:
          anyOf:
            - $ref: "#/components/schemas/PixKeyType"
            - type: "null"
        maskedPixKey:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - winningBidId
        - winningBidAmountCents
        - prizeCents
        - bonusCents
        - withdrawalStatus
        - pixType
        - maskedPixKey
        - createdAt
    AccountBidHistoryStatus:
      type: string
      enum: [leading, outbid, won, closed_without_win, cancelled]
    AccountBidHistoryItem:
      type: object
      properties:
        id:
          type: integer
        roundId:
          type: string
        prizeCents:
          type: integer
        amountCents:
          type: integer
        status:
          $ref: "#/components/schemas/AccountBidHistoryStatus"
        createdAt:
          type: string
          format: date-time
        win:
          anyOf:
            - $ref: "#/components/schemas/AccountWin"
            - type: "null"
      required: [id, roundId, prizeCents, amountCents, status, createdAt, win]
    AccountBidHistoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountBidHistoryItem"
        nextCursor:
          type: ["integer", "null"]
      required: [items, nextCursor]
    CurrentAccount:
      type: object
      properties:
        signedIn:
          type: boolean
        email:
          type: ["string", "null"]
          format: email
        creditsCents:
          type: integer
        topUpOptionsCents:
          type: array
          items:
            type: integer
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/AccountTransaction"
        wins:
          type: array
          items:
            $ref: "#/components/schemas/AccountWin"
      required:
        - signedIn
        - email
        - creditsCents
        - topUpOptionsCents
        - transactions
        - wins
    DemoAuctionBid:
      type: object
      properties:
        id:
          type: integer
        bidderName:
          type: string
        amountCents:
          type: integer
        createdAt:
          type: string
          format: date-time
        isCurrentUser:
          type: boolean
      required: [id, bidderName, amountCents, createdAt, isCurrentUser]
    DemoAuction:
      type: object
      properties:
        id:
          type: string
        prizeCents:
          type: integer
        durationSeconds:
          type: integer
        initialBidCents:
          type: integer
        currentBidCents:
          type: integer
        minimumBidCents:
          type: integer
        suggestedBidIncrementsCents:
          type: array
          items:
            type: integer
        bonusCents:
          type: integer
        remainingSeconds:
          type: integer
        scheduledRemainingSeconds:
          type: integer
        status:
          type: string
          enum: [live, urgent, closed, scheduled, idle]
        isCurrentUserLastBid:
          type: boolean
        currentUserLastBidAmountCents:
          type: ["integer", "null"]
        bids:
          type: array
          items:
            $ref: "#/components/schemas/DemoAuctionBid"
      required:
        - id
        - prizeCents
        - durationSeconds
        - initialBidCents
        - currentBidCents
        - minimumBidCents
        - suggestedBidIncrementsCents
        - bonusCents
        - remainingSeconds
        - scheduledRemainingSeconds
        - status
        - isCurrentUserLastBid
        - currentUserLastBidAmountCents
        - bids
    DemoAuctionBidInput:
      type: object
      properties:
        amountCents:
          type: integer
          minimum: 1
      required: [amountCents]
    DemoAuctionError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

